name: Preview

on: pull_request

# Least privilege. The deploy action needs to post the preview URL back onto
# the PR, and nothing else.
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Pull requests from forks must not reach repository secrets. Generated by
    # the Firebase CLI and kept deliberately.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The CLI generates this workflow with no build step at all. out/ is
      # gitignored, so without this it deploys an empty directory.
      - name: Build and verify export
        run: npm run verify

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELMCP_PORTFOLIO_WEBSITE }}
          projectId: elmcp-portfolio-website
          expires: 7d
