name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. This job only reads the repo and authenticates to Firebase
# through the service-account secret; it needs no write access to GitHub.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Builds, then asserts the export is shippable: nothing at opacity:0,
      # the CV present as text in the HTML. A build that would deploy a blank
      # page fails here rather than reaching Firebase.
      - name: Build and verify export
        run: npm run verify

      # Secret name matches what `firebase init hosting:github` generates:
      # FIREBASE_SERVICE_ACCOUNT_<PROJECT ID, uppercased, hyphens to underscores>
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELMCP_PORTFOLIO_WEBSITE }}
          channelId: live
          projectId: elmcp-portfolio-website
