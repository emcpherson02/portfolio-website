name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Credentials come from OIDC role assumption, not stored keys.
permissions:
  id-token: write
  contents: read

# A second push should not race the first one's S3 sync.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Builds, then asserts the export is shippable: nothing at opacity:0,
      # the CV present as text, internal links carrying trailing slashes.
      - name: Build and verify export
        run: npm run verify

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      # Hashed assets first and long-lived, so they are already in place when
      # the HTML that references them goes up.
      - name: Upload static assets
        run: |
          aws s3 sync out/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --delete \
            --exclude "*.html" \
            --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"

      # HTML must revalidate, otherwise a deploy is invisible until the cache
      # expires.
      - name: Upload HTML
        run: |
          aws s3 sync out/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" \
            --paths "/*"
